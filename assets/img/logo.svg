<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="IMS Studio">
  <defs>
    <radialGradient id="lens" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#35818f"/>
      <stop offset="55%" stop-color="#12242a"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
  </defs>

  <!-- خلفية العدسة -->
  <circle cx="200" cy="200" r="196" fill="#08090b"/>
  <circle cx="200" cy="200" r="168" fill="url(#lens)"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#2a3138" stroke-width="6"/>

  <!-- مونوجرام IMS -->
  <g fill="#ffffff">
    <!-- عمود M الخارجي يسار + العمود الداخلي -->
    <rect x="96"  y="86" width="20" height="228"/>
    <rect x="126" y="86" width="13" height="228"/>
    <!-- عمود M الخارجي يمين + العمود الداخلي -->
    <rect x="284" y="86" width="20" height="228"/>
    <rect x="261" y="86" width="13" height="228"/>
    <!-- الشريط العلوي الرابط -->
    <rect x="96" y="86" width="208" height="18"/>
  </g>

  <!-- قمة M الوسطى -->
  <path d="M148 244 L200 112 L252 244" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="miter"/>

  <!-- حرف I: العمود المركزي -->
  <rect x="192" y="104" width="16" height="210" fill="#ffffff"/>

  <!-- حرف S: الحدّ الأسود بيفصله عن الـ M اللي وراه -->
  <path d="M252 178 H158 V240 H242 V302 H148"
        fill="none" stroke="#08090b" stroke-width="44" stroke-linecap="butt" stroke-linejoin="miter"/>
  <path d="M252 178 H158 V240 H242 V302 H148"
        fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter"/>

</svg>
