<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="شعار الشركة">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d488"/>
      <stop offset="45%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#b3761f"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0c0f"/>
      <stop offset="100%" stop-color="#1b1f27"/>
    </linearGradient>
  </defs>

  <!-- الخلفية الدائرية -->
  <circle cx="256" cy="256" r="248" fill="url(#g2)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#g1)" stroke-width="4" opacity=".55"/>

  <!-- ريش عدسة الكاميرا (Aperture) -->
  <g transform="translate(256,256)" fill="none" stroke="url(#g1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <g id="blades">
      <path d="M0,-150 L75,-20" transform="rotate(0)"/>
      <path d="M0,-150 L75,-20" transform="rotate(60)"/>
      <path d="M0,-150 L75,-20" transform="rotate(120)"/>
      <path d="M0,-150 L75,-20" transform="rotate(180)"/>
      <path d="M0,-150 L75,-20" transform="rotate(240)"/>
      <path d="M0,-150 L75,-20" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="150" stroke-width="12" opacity=".9"/>
  </g>

  <!-- زر التشغيل: رمز المونتاج والفيديو -->
  <path d="M228 208 L318 256 L228 304 Z" fill="url(#g1)"/>

  <!-- نقاط التفاعل: رمز السوشيال ميديا -->
  <circle cx="256" cy="70" r="12" fill="url(#g1)"/>
  <circle cx="256" cy="442" r="12" fill="url(#g1)"/>
</svg>
